    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const fullTitle = "~$ Jxks.dev";
        let isForward = true;
        let currentLength = 0;
        const minLength = 1;
        const maxLength = fullTitle.length;
        const typingSpeed = 300;
        const pauseAtEnds = 1500;
        
        function updateTitle() {
          if (currentLength >= maxLength) {
            isForward = false;
            setTimeout(animateTitle, pauseAtEnds);
            return;
          } else if (currentLength <= minLength) {
            isForward = true;
            setTimeout(animateTitle, pauseAtEnds);
            return;
          }
          
          setTimeout(animateTitle, typingSpeed);
        }
        
        function animateTitle() {
          if (isForward) {
            currentLength++;
          } else {
            currentLength--;
          }
          
          currentLength = Math.max(minLength, Math.min(maxLength, currentLength));
          
          document.title = fullTitle.substring(0, currentLength);
          
          updateTitle();
        }
        
        animateTitle();
      });
    </script>
  </head>
