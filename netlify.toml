[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Content-Type = "video/mp4"